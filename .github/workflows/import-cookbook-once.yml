name: Import source-verified cookbook
on:
  push:
    branches: [feature/full-cookbook-catalogue]
    paths: [.github/workflows/import-cookbook-once.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
      - name: Verify exact source and base
        env:
          BUNDLE_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-dc6c-81f4-865c-bda35aaef253/raw?se=2026-09-16T22%3A06%3A14Z&sp=r&sv=2026-02-06&sr=b&scid=037e2ab3-b120-575b-8110-a12e21a35b18&skoid=b32d65cd-c8f1-46fb-90df-c208671889d4&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-16T18%3A52%3A19Z&ske=2026-09-17T18%3A52%3A19Z&sks=b&skv=2026-02-06&sig=3Zdfen9ZpixHH8gpZfw6bE9KlKMbaxXTxwFHnSrHfYw%3D'
        run: |
          test "$(git rev-parse HEAD^)" = '84262f49d04d967cbf71df29d67586958fec748d'
          curl --fail --silent --show-error --location "$BUNDLE_URL" -o /tmp/cookbook.zip
          echo '149ccbf9346ff0320ff465a338c9fd7f9ab039f742be6198bc5779aa69289e02  /tmp/cookbook.zip' | sha256sum --check
          python - <<'PY'
          import zipfile,json,hashlib,pathlib
          allowed={'README.md','package.json','docs/COOKBOOK-IMPORT.md','src/data.mjs','src/commerce.mjs','src/experience.mjs','src/cookbook-pages.mjs','public/recipes-data.mjs','public/recipe-display.mjs','public/meal-core.mjs','public/food.mjs','public/food.css','scripts/build.mjs','scripts/build-recipe-catalogue.mjs','scripts/extract-cookbook.py','scripts/check-production.mjs','tests/cookbook.test.mjs','tests/cookbook-browser.py','tests/meal-core.test.mjs','tests/commerce.test.mjs','tests/food-browser.py','supabase/migrations/202609160003_recipe_catalogue.sql','supabase/seeds/high-protein-kitchen.sql','supabase/tests/catalogue.sql'}
          with zipfile.ZipFile('/tmp/cookbook.zip') as z:
              manifest=json.loads(z.read('implementation-manifest.json'))
              assert len(manifest)==128 and set(z.namelist())==set(manifest)|{'implementation-manifest.json'}
              for name,digest in manifest.items():
                  p=pathlib.PurePosixPath(name)
                  assert not p.is_absolute() and '..' not in p.parts
                  assert name in allowed or (name.startswith('public/assets/cookbook/') and name.endswith('.webp')) or (name.startswith('data/cookbooks/') and name.endswith('.json'))
                  data=z.read(name);assert len(data)<2000000 and hashlib.sha256(data).hexdigest()==digest
                  dest=pathlib.Path(name);dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(data)
              pathlib.Path('/tmp/cookbook-files.json').write_text(json.dumps(list(manifest)))
          PY
      - name: Validate catalogue and website
        run: npm run check
      - name: Commit only verified source and recipe images
        run: |
          python - <<'PY'
          import json,subprocess
          subprocess.run(['git','add','--',*json.load(open('/tmp/cookbook-files.json'))],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Import all 100 High Protein Kitchen recipes and actual book shop listing' -m 'Preserve source nutrition, serving bases, 1038 ingredient rows, 575 method steps and 99 original photos. Retain personal overrides and old recipe IDs. Include a target-neutral database seed, not a new project: live Nutrition.Fitness database has not yet been identified through authorised settings. No other business database is touched. Book pricing remains pending; paid PDF is not published.'
          git push origin HEAD:feature/full-cookbook-catalogue
