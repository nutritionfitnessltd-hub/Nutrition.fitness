name: Launch preview build
on:
  push:
    branches: [launch/december-2026, main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: launch-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: nufi_ci
          POSTGRES_PASSWORD: disposable-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: disposable-ci-only
      PGDATABASE: nufi_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Retrieve credited photo assets
        run: node scripts/fetch-photo-assets.mjs
      - name: Test source and generated links
        run: npm run check
      - name: Test database migration and account isolation
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
          for migration in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -f "$migration"; done
          psql -v ON_ERROR_STOP=1 -f supabase/tests/integrity.sql
          psql -v ON_ERROR_STOP=1 -f supabase/seeds/high-protein-kitchen.sql
          psql -v ON_ERROR_STOP=1 -f supabase/seeds/high-protein-kitchen.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/catalogue.sql
      - name: Install test browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Exercise real HTTP browser journeys
        run: |
          node scripts/serve.mjs > /tmp/nufi-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          python tests/food-browser.py
          python tests/cookbook-browser.py
          python tests/packshot-browser.py
          python tests/timer-browser.py
          python tests/sitewide-banner-browser.py
          python tests/form-modals-browser.py
          python tests/finder-character-browser.py
          python tests/homepage-highlights-browser.py
          python tests/home-feature-panels-browser.py
      - name: Confirm public production after authorised main deployment
        if: github.ref == 'refs/heads/main'
        run: |
          node scripts/check-production.mjs
          NUFI_TEST_BASE_URL=https://www.nutrition.fitness python tests/timer-browser.py
          NUFI_TEST_BASE_URL=https://www.nutrition.fitness python tests/sitewide-banner-browser.py
          NUFI_TEST_BASE_URL=https://www.nutrition.fitness python tests/cookbook-browser.py
          NUFI_TEST_BASE_URL=https://www.nutrition.fitness python tests/form-modals-browser.py
          NUFI_TEST_BASE_URL=https://www.nutrition.fitness python tests/finder-character-browser.py
          NUFI_TEST_BASE_URL=https://www.nutrition.fitness python tests/homepage-highlights-browser.py
          NUFI_TEST_BASE_URL=https://www.nutrition.fitness python tests/home-feature-panels-browser.py
      - name: Package source, generated site and test evidence
        if: always()
        run: zip -qr nutrition-fitness-source.zip . -x '.git/*' '*.zip' 'node_modules/*'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nutrition-fitness-source
          path: |
            nutrition-fitness-source.zip
            test-results/
          retention-days: 14
