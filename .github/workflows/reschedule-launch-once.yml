name: Reschedule launch to 1 November
on:
  push:
    branches: [launch/december-2026]
    paths: [.github/workflows/reschedule-launch-once.yml]
permissions:
  contents: write
jobs:
  reschedule:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: nufi_ci
          POSTGRES_PASSWORD: disposable-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: disposable-ci-only
      PGDATABASE: nufi_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
      - name: Apply bounded application-source edits
        run: |
          test "$(git rev-parse HEAD^)" = '1d704f44ebb3447911ebf4cf1729d5fae2db3657'
          python - <<'PY'
          from pathlib import Path
          import re,json
          root=Path.cwd()
          changes={
            'public/launch-config.mjs':[('2026-12-01T09:00:00.000Z','2026-11-01T09:00:00.000Z',1),('1 December 2026','1 November 2026',1)],
            'public/launch.mjs':[('1 December 2026','1 November 2026',1)],
            'public/food.mjs':[('1 December, 9am UK','1 November, 9am UK',1)],
            'public/launch.css':[('the December launch journey','the November launch journey',1)],
            'src/experience.mjs':[('1 December','1 November',2)],
            'scripts/build-launch.mjs':[('1 December countdown','1 November countdown',1)],
            'tests/launch.test.mjs':[('2026-12-01T09:00:00.000Z','2026-11-01T09:00:00.000Z',1),('2026-11-30T23:59:59Z','2026-10-31T23:59:59Z',1)],
            'tests/platform.test.mjs':[('2026-11-30T12:00Z','2026-10-31T12:00Z',1)],
            'tests/launch-presentation.test.mjs':[('1 December 2026','1 November 2026',1),('2026-12-01T09:00:00.000Z','2026-11-01T09:00:00.000Z',1)],
            'tests/timer-browser.py':[('1 December 2026','1 November 2026',1),('datetime(2026, 12, 1, 9, 0,','datetime(2026, 11, 1, 9, 0,',1)],
            'supabase/tests/integrity.sql':[('2026-12-01T09:00:00Z','2026-11-01T09:00:00Z',1)],
            'README.md':[('— December launch website','— November launch website',1),('1 December 2026','1 November 2026',1)],
            'docs/LAUNCH-BUILD-STATUS.md':[('1 December 2026','1 November 2026',1)],
          }
          assert 'for migration in supabase/migrations/*.sql;' in (root/'.github/workflows/launch-build.yml').read_text()
          prepared={}
          for name,edits in changes.items():
              text=(root/name).read_text()
              for old,new,count in edits:
                  if text.count(old)!=count:raise ValueError(f'{name}: unexpected source for {old!r}')
                  text=text.replace(old,new)
              prepared[name]=text
          original=(root/'supabase/migrations/202609160001_nufi_launch.sql').read_text()
          match=re.search(r'create function public\.nufi_activate_trial\(actor uuid\).*?end;\$\$;',original,re.S)
          if not match:raise ValueError('Existing activation function not found')
          fn=match.group(0)
          assert fn.count('2026-12-01 09:00:00+00')==1
          fn=fn.replace('create function','create or replace function',1).replace('2026-12-01 09:00:00+00','2026-11-01 09:00:00+00')
          prepared['supabase/migrations/202609160002_nufi_november_launch.sql']='''-- Launch moved to 1 November 2026, 09:00 UK (09:00 UTC).
          -- Only the activation guard changes. Preserve reservations, grants, expiry dates,
          -- and the original offer identifier so no second free month is created.
          begin;
          '''+fn+'''
          revoke all on function public.nufi_activate_trial(uuid) from public,anon,authenticated;
          grant execute on function public.nufi_activate_trial(uuid) to service_role;
          commit;
          '''
          prepared['docs/LAUNCH-BUILD-STATUS.md']+='''
          ## Launch rescheduled — 16 September 2026

          The agreed launch is now **1 November 2026 at 9am UK time**. The larger countdown design is unchanged. Signup confirmations, programme availability, account activation wording, server date checks and browser tests use the new date.

          Apply all migrations in filename order, including `202609160002_nufi_november_launch.sql`. That additive migration moves the database activation guard; it does not delete or restart existing trials. The existing `nufi-launch-2026-12-v1` value remains an opaque offer identifier intentionally: changing it could grant a second free month. The branch name and preview URL remain unchanged to preserve review/deployment continuity. Private live-service configuration and explicit app-release approval are still required; the calendar alone never enables unfinished app access.
          '''
          prepared['tests/launch-reschedule.test.mjs']='''import test from 'node:test';
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {LAUNCH,countdownParts,freeMonthEndsAt,launchState} from '../public/launch-config.mjs';
          const read=p=>readFileSync(new URL('../'+p,import.meta.url),'utf8');
          test('November launch remains 9am UK and preserves the same trial offer',()=>{
           assert.equal(LAUNCH.at,'2026-11-01T09:00:00.000Z');
           assert.equal(LAUNCH.label,'1 November 2026 · 9am UK time');
           assert.equal(LAUNCH.version,'nufi-launch-2026-12-v1');
           const time=new Intl.DateTimeFormat('en-GB',{timeZone:LAUNCH.timezone,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date(LAUNCH.at));
           assert.equal(time,'09:00');
          });
          test('new launch boundary never opens access early or without approval',()=>{
           const t=Date.parse(LAUNCH.at);
           assert.equal(countdownParts(t-1).reached,false);
           assert.equal(countdownParts(t).reached,true);
           assert.equal(launchState(t-1,true),'prelaunch');
           assert.equal(launchState(t,false),'awaiting-release');
           assert.equal(launchState(t,true),'live');
           assert.throws(()=>freeMonthEndsAt(new Date(t-1).toISOString()));
           assert.equal(freeMonthEndsAt(LAUNCH.at),'2026-12-01T09:00:00.000Z');
          });
          test('late November activation still receives a whole calendar month',()=>{
           assert.equal(freeMonthEndsAt('2026-11-30T12:00:00Z'),'2026-12-30T12:00:00.000Z');
          });
          test('additive database migration changes only the activation date and retains offer identity',()=>{
           const migration=read('supabase/migrations/202609160002_nufi_november_launch.sql');
           const original=read('supabase/migrations/202609160001_nufi_launch.sql');
           const pattern=/create (?:or replace )?function public\\.nufi_activate_trial\\(actor uuid\\)[\\s\\S]*?end;\\$\\$;/;
           const fn=original.match(pattern)[0];
           assert.equal(migration.match(pattern)[0],fn.replace('create function','create or replace function').replace('2026-12-01 09:00:00+00','2026-11-01 09:00:00+00'));
           assert.ok(read('.github/workflows/launch-build.yml').includes('for migration in supabase/migrations/*.sql;'));
          });
          test('customer-facing launch copy has no stale December launch date',()=>{
           for(const file of ['public/launch-config.mjs','public/launch.mjs','public/food.mjs','src/experience.mjs','src/launch-layout.mjs']){
            const text=read(file);
            assert.ok(!text.includes('1 December'),file+' has stale launch wording');
            assert.ok(!text.includes('2026-12-01T09:00'),file+' has a stale launch instant');
           }
          });
          '''
          for name,text in prepared.items():
              assert not name.startswith('.github/')
              p=root/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)
          Path('/tmp/nufi-reschedule-files.json').write_text(json.dumps(list(prepared)))
          print('Prepared',len(prepared),'application-source changes; no workflow mutation.')
          PY
      - name: Verify code and generated site
        run: npm run check
      - name: Verify all database migrations and isolation
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
          for migration in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -f "$migration"; done
          psql -v ON_ERROR_STOP=1 -f supabase/tests/integrity.sql
      - name: Verify browser journeys and larger November countdown
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          node scripts/serve.mjs > /tmp/nufi-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          python tests/food-browser.py
          python tests/packshot-browser.py
          python tests/timer-browser.py
      - name: Commit only verified application source
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          files=json.loads(Path('/tmp/nufi-reschedule-files.json').read_text())
          assert all(not f.startswith('.github/') for f in files)
          subprocess.run(['git','add','--',*files],check=True)
          staged=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert set(staged)==set(files)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Move Nutrition.Fitness launch to 1 November 2026 at 9am UK' -m 'Update countdown, customer-facing launch wording, activation date checks and additive database migration. Preserve enlarged timer styling, approved homepage, original free-month offer identity and production main. Code, database and HTTP browser checks passed before commit.'
          git push origin HEAD:launch/december-2026
          git rev-parse HEAD > test-results/verified-commit.txt
      - name: Package updated source and verification evidence
        if: always()
        run: zip -qr nutrition-fitness-november-launch.zip . -x '.git/*' '*.zip' 'node_modules/*'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nutrition-fitness-november-launch
          path: |
            nutrition-fitness-november-launch.zip
            test-results/
          retention-days: 14
