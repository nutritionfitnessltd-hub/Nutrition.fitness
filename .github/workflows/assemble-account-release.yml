name: Verify account release candidate
on:
  push:
    branches: [feature/accounts-admin-20260921]
    paths: ['.github/workflows/assemble-account-release.yml']
permissions:
  contents: write
jobs:
  candidate:
    if: github.repository == 'nutritionfitnessltd-hub/Nutrition.fitness'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: nufi_ci
          POSTGRES_PASSWORD: disposable-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: disposable-ci-only
      PGDATABASE: nufi_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify exact reviewed patch and stage source changes
        run: |
          test "$(git rev-parse HEAD^)" = 65ce9be28cfbb80bbca1cca6947a402b306cfe4e
          echo 'ff4a678df51d0db19a723b49be21edc69d4e5b66deb4db7bba93ee1939d659f5  .github/release/part1.patch' | sha256sum --check
          echo 'f9bbd22e1687c9ef14bb695b6b30e6a0637d5f239aa7e0995afe6d519ec77ae5  .github/release/part2.patch' | sha256sum --check
          echo '57bf65dfa630712bdb253a32c0a3e899b729bb61c24c4f1906d6683d178d9875  .github/release/part3.patch' | sha256sum --check
          git apply --unidiff-zero --index --check .github/release/part1.patch .github/release/part2.patch .github/release/part3.patch
          git apply --unidiff-zero --index .github/release/part1.patch .github/release/part2.patch .github/release/part3.patch
          git diff --cached --stat
      - name: Test source and build
        run: npm run check
      - name: Test disposable database and concurrent login limits
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
          for migration in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -f "$migration"; done
          psql -v ON_ERROR_STOP=1 -f supabase/tests/integrity.sql
          psql -v ON_ERROR_STOP=1 -f supabase/seeds/high-protein-kitchen.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/catalogue.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/private_recipe_content.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/account-management.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/website-management.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/provisioned-login.sql
          python tests/provisioned-login-race.py
      - name: Install test browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Exercise existing and new account browser journeys
        run: |
          node scripts/serve.mjs > /tmp/nufi-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          python tests/account-admin-browser.py
          python tests/provisioned-login-browser.py
      - name: Prepare tested commit object without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, json, os, pathlib, subprocess, urllib.request
          repo='nutritionfitnessltd-hub/Nutrition.fitness'
          parent=os.environ['GITHUB_SHA']
          allowed={'.github/workflows/launch-build.yml','api/account.js','api/auth.js','docs/auth-activation/PROVISIONED-LOGIN-TEST.md','public/account.mjs','scripts/check-account-production.mjs','server/platform.mjs','server/provisioned-login.mjs','server/recipe-access.mjs','supabase/migrations/20260922090943_nufi_provisioned_login.sql','supabase/schema/provisioned-login.sql','supabase/tests/provisioned-login.sql','tests/provisioned-login-browser.py','tests/provisioned-login-race.py','tests/provisioned-login.test.mjs','vercel.json'}
          paths=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert paths==allowed, 'Unexpected release file set'
          def api(path,body=None):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+path,data=None if body is None else json.dumps(body).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=40) as response:return json.load(response)
          assert api('/git/ref/heads/feature/accounts-admin-20260921')['object']['sha']==parent, 'Branch changed; no overwrite permitted'
          entries=[]
          for name in sorted(paths):
              content=subprocess.check_output(['git','show',':'+name])
              sha=api('/git/blobs',{'encoding':'base64','content':base64.b64encode(content).decode()})['sha']
              expected=subprocess.check_output(['git','rev-parse',':'+name],text=True).strip()
              assert sha==expected, 'Uploaded source does not match tested index'
              entries.append({'path':name,'mode':'100644','type':'blob','sha':sha})
          transient=['.github/workflows/assemble-account-release.yml']+['.github/release/part'+str(i)+'.patch' for i in range(1,4)]
          for name in transient:entries.append({'path':name,'mode':'100644','type':'blob','sha':None})
          tree=api('/git/trees',{'base_tree':api('/git/commits/'+parent)['tree']['sha'],'tree':entries})['sha']
          commit=api('/git/commits',{'message':'Enable rate-limited password login for pre-created accounts; keep email flows disabled','tree':tree,'parents':[parent]})['sha']
          report={'testedCommitSha':commit,'parentSha':parent,'treeSha':tree,'branchUpdated':False,'tests':'source,build,PostgreSQL17,20-connection limit race,account and provisioned browser fixtures','applicationCredentialsUsed':False,'files':sorted(paths)}
          pathlib.Path('test-results/release-candidate.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: account-release-candidate
          path: test-results/
          retention-days: 7
