name: Final account release check
on:
  push:
    branches: [fix/account-origin-20260922]
    paths: ['.github/workflows/final-account-release-check.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 273bfac3574d44a24f18102565a76de94d74ee81
          persist-credentials: false
      - name: Build exact deployed source
        run: |
          npm run build > /tmp/build.log 2>&1 || { tail -n 20 /tmp/build.log; exit 1; }
          npm run check > /tmp/check.log 2>&1 || { tail -n 25 /tmp/check.log; exit 1; }
      - name: Install test browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Capture independent public checks without owner credentials
        run: |
          python - <<'PY'
          import json,os,pathlib,subprocess
          out=pathlib.Path('test-results');out.mkdir(exist_ok=True)
          env=dict(os.environ,NUFI_TEST_BASE_URL='https://www.nutrition.fitness',GITHUB_SHA='273bfac3574d44a24f18102565a76de94d74ee81')
          commands=[['node','scripts/check-account-production.mjs'],['python','tests/cookbook-browser.py'],['python','tests/form-modals-browser.py']]
          results=[]
          for command in commands:
              try:
                  result=subprocess.run(command,env=env,capture_output=True,text=True,timeout=150)
                  log=result.stdout+'\n'+result.stderr
                  row={'command':command,'exitCode':result.returncode,'tail':log.splitlines()[-22:]}
              except subprocess.TimeoutExpired:
                  row={'command':command,'exitCode':124,'tail':['Check exceeded 150 seconds.']}
              results.append(row)
          report={'sourceCommit':env['GITHUB_SHA'],'ownerCredentialsUsed':False,'results':results}
          (out/'final-public-checks.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - name: Package generated build with honest verification report
        run: zip -qr nutrition-fitness-site-review.zip dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: final-account-release-check
          path: |
            nutrition-fitness-site-review.zip
            test-results/account-production-smoke.json
            test-results/final-public-checks.json
            test-results/cookbook-browser.json
            test-results/form-modals-browser.json
          retention-days: 7
